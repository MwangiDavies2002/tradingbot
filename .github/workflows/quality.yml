name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mrbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: mean-reversion-bot/backend
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only-password@localhost:5432/mrbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mean-reversion-bot/backend/requirements.txt
      - run: pip install -r requirements.txt aiosqlite
      - run: python -m pytest -q --disable-warnings
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app migrations
      - name: Migration and schema drift check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test-only-password@localhost:5432/mrbot_test
        run: |
          alembic upgrade head
          alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mean-reversion-bot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mean-reversion-bot/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:tradingview
